version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/Axiom.Atlas.API"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/Axiom.Atlas.Web"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/Axiom.Atlas.Migrator"
    schedule:
      interval: "weekly"
