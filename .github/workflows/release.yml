name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate-build-and-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: axiom_atlas_release
          POSTGRES_USER: axiom_release
          POSTGRES_PASSWORD: release-only-password
        options: >-
          --health-cmd "pg_isready -U axiom_release -d axiom_atlas_release"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=axiom_atlas_release;Username=axiom_release;Password=release-only-password
      JwtSettings__SecretKey: release-only-secret-with-at-least-thirty-two-characters
      JwtSettings__Issuer: AxiomAtlasApi
      JwtSettings__Audience: AxiomAtlasWeb
      JwtSettings__ExpirationMinutes: 480
      DataProtection__KeysPath: /tmp/axiom-atlas-release-keys
      PublicUrls__WebBaseUrl: https://release.example.test
      EmailSettings__SmtpServer: smtp.example.test
      EmailSettings__SmtpPort: 587
      EmailSettings__SenderName: Axiom Atlas Release
      EmailSettings__SenderEmail: release@example.test
      EmailSettings__Username: release@example.test
      EmailSettings__Password: release-only-password
      Authentication__CookieExpirationMinutes: 480

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Restore, build and test
        run: |
          dotnet restore Axiom.Atlas.slnx
          dotnet tool install --global dotnet-ef --version 10.0.9
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          dotnet build Axiom.Atlas.slnx --configuration Release --no-restore
          dotnet test Axiom.Atlas.slnx --configuration Release --no-build --no-restore

      - name: Validate empty PostgreSQL baseline
        run: |
          dotnet run --project Axiom.Atlas.Migrator/Axiom.Atlas.Migrator.csproj -- migrate
          dotnet ef migrations has-pending-model-changes --project Axiom.Atlas.Persistence/Axiom.Atlas.Persistence.csproj --startup-project Axiom.Atlas.API/Axiom.Atlas.API.csproj

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine candidate version after validation
        id: version
        shell: pwsh
        run: |
          $latestTag = git tag --list 'v*' --sort=-version:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          $arguments = @()
          if ($latestTag) { $arguments += '--minimum'; $arguments += $latestTag.TrimStart('v') }
          $version = & node version-update.js @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine the next release version.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish release images
        uses: docker/bake-action@v6
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        with:
          push: true
          files: |
            docker-bake.hcl
          targets: api,web,migrator

      - name: Publish applications and build release package
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          properties=("/p:Version=${RELEASE_VERSION}" "/p:AssemblyVersion=${RELEASE_VERSION}" "/p:FileVersion=${RELEASE_VERSION}" "/p:InformationalVersion=${RELEASE_VERSION}+${REVISION}" "/p:IncludeSourceRevisionInInformationalVersion=false")
          dotnet publish Axiom.Atlas.API/Axiom.Atlas.API.csproj --configuration Release --no-restore --output artifacts/api "${properties[@]}"
          dotnet publish Axiom.Atlas.Web/Axiom.Atlas.Web.csproj --configuration Release --no-restore --output artifacts/web "${properties[@]}"
          dotnet publish Axiom.Atlas.Migrator/Axiom.Atlas.Migrator.csproj --configuration Release --no-restore --output artifacts/migrator "${properties[@]}"
          mkdir -p release
          (cd artifacts/api && zip -qr "../../release/AxiomAtlas-API-${RELEASE_VERSION}.zip" .)
          (cd artifacts/web && zip -qr "../../release/AxiomAtlas-Web-${RELEASE_VERSION}.zip" .)
          (cd artifacts/migrator && zip -qr "../../release/AxiomAtlas-Migrator-${RELEASE_VERSION}.zip" .)
          tar --exclude='.env' --exclude='*.local' -czf "release/AxiomAtlas-Deployment-${RELEASE_VERSION}.tar.gz" deploy docs
          sha256sum release/* > "release/AxiomAtlas-${RELEASE_VERSION}-SHA256SUMS.txt"

      - name: Persist version only after all validations and publications succeed
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Axiom.Atlas.Web/Axiom.Atlas.Web.csproj
          git commit -m "chore: bump version to ${RELEASE_VERSION} [skip ci]"
          git push origin HEAD:main
          git tag --annotate "v${RELEASE_VERSION}" --message "Release ${RELEASE_VERSION}"
          git push origin "v${RELEASE_VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${RELEASE_VERSION}" release/* --title "Axiom Atlas ${RELEASE_VERSION}" --generate-notes --repo "$GITHUB_REPOSITORY"
