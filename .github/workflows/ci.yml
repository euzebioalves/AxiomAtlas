name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and production stack
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.5-bookworm
        env:
          POSTGRES_DB: axiom_atlas_ci
          POSTGRES_USER: axiom_ci
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U axiom_ci -d axiom_atlas_ci"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=axiom_atlas_ci;Username=axiom_ci;Password=ci-only-password
      JwtSettings__SecretKey: ci-only-secret-with-at-least-thirty-two-characters
      JwtSettings__Issuer: AxiomAtlasApi
      JwtSettings__Audience: AxiomAtlasWeb
      JwtSettings__ExpirationMinutes: 480
      DataProtection__KeysPath: /tmp/axiom-atlas-ci-keys
      PublicUrls__WebBaseUrl: https://ci.example.test
      EmailSettings__SmtpServer: smtp.example.test
      EmailSettings__SmtpPort: 587
      EmailSettings__SenderName: Axiom Atlas CI
      EmailSettings__SenderEmail: ci@example.test
      EmailSettings__Username: ci@example.test
      EmailSettings__Password: ci-only-password
      Authentication__CookieExpirationMinutes: 480
      AXIOM_DOMAIN: ci.example.test
      AXIOM_LOCAL_PORT: 8088

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Axiom.Atlas.slnx

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build Release
        run: dotnet build Axiom.Atlas.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test Axiom.Atlas.slnx --configuration Release --no-build --no-restore

      - name: Apply production baseline to an empty PostgreSQL database
        run: dotnet run --project Axiom.Atlas.Migrator/Axiom.Atlas.Migrator.csproj -- migrate

      - name: Verify schema and migration history
        env:
          PGPASSWORD: ci-only-password
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql -h localhost -U axiom_ci -d axiom_atlas_ci -v ON_ERROR_STOP=1 -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory";'
          psql -h localhost -U axiom_ci -d axiom_atlas_ci -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM "AspNetUsers" LIMIT 1;'
          psql -h localhost -U axiom_ci -d axiom_atlas_ci -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM "TimeEntries" LIMIT 1;'

      - name: Check EF model consistency
        run: dotnet ef migrations has-pending-model-changes --project Axiom.Atlas.Persistence/Axiom.Atlas.Persistence.csproj --startup-project Axiom.Atlas.API/Axiom.Atlas.API.csproj

      - name: Start API and validate health/security endpoints
        run: |
          dotnet run --project Axiom.Atlas.API/Axiom.Atlas.API.csproj --configuration Release --no-build --urls http://127.0.0.1:18080 > /tmp/axiom-api.log 2>&1 &
          echo $! > /tmp/axiom-api.pid
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:18080/health/ready && break || sleep 1; done
          curl --fail --silent http://127.0.0.1:18080/health/live
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/register)" = "404"

      - name: Build container images
        run: |
          docker build -f Axiom.Atlas.API/Dockerfile -t axiom-atlas-api:ci --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} .
          docker build -f Axiom.Atlas.Web/Dockerfile -t axiom-atlas-web:ci --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} .
          docker build -f Axiom.Atlas.Migrator/Dockerfile -t axiom-atlas-migrator:ci --build-arg VERSION=0.0.0-ci --build-arg REVISION=${GITHUB_SHA} .

      - name: Prepare production-like environment
        run: |
          set -Eeuo pipefail
          # The runner uses localhost; containers must resolve PostgreSQL by its internal service name.
          unset ConnectionStrings__DefaultConnection
          cp deploy/.env.example .env
          sed -i \
            -e 's/CHANGE_ME.example.com/ci.example.test/g' \
            -e 's/CHANGE_ME_GENERATE_A_LONG_RANDOM_VALUE/ci-postgres-password/g' \
            -e 's/CHANGE_ME_GENERATE_AT_LEAST_32_RANDOM_CHARACTERS/ci-secret-with-at-least-thirty-two-characters/g' \
            -e 's/CHANGE_ME:axiom-atlas/local:axiom-atlas/g' \
            -e 's/^EmailSettings__SmtpServer=.*/EmailSettings__SmtpServer=smtp.example.test/' \
            -e 's/^EmailSettings__SenderEmail=.*/EmailSettings__SenderEmail=ci@example.test/' \
            -e 's/^EmailSettings__Username=.*/EmailSettings__Username=ci@example.test/' \
            -e 's/^EmailSettings__Password=.*/EmailSettings__Password=ci-password/' \
            -e 's/^BOOTSTRAP_ADMIN_USERNAME=.*/BOOTSTRAP_ADMIN_USERNAME=ciadmin/' \
            -e 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=ciadmin@example.test/' \
            -e 's/^BOOTSTRAP_ADMIN_FULL_NAME=.*/BOOTSTRAP_ADMIN_FULL_NAME=CI Administrator/' \
            -e 's/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD=Ci-Only!Password123/' .env
          docker compose --env-file .env -f deploy/compose.prod.yml config >/dev/null
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml config >/dev/null
          docker run --rm \
            --env AXIOM_DOMAIN=ci.example.test \
            --env CADDY_EMAIL=ci@example.test \
            --volume "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            --env AXIOM_DOMAIN=ci.example.test \
            --env CADDY_EMAIL= \
            --volume "$GITHUB_WORKSPACE/deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start PostgreSQL
        run: |
          set -Eeuo pipefail
          unset ConnectionStrings__DefaultConnection
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml build
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml up -d --wait postgres

      - name: Run production migration
        run: |
          set -Eeuo pipefail
          unset ConnectionStrings__DefaultConnection
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml run --rm migrate

      - name: Validate idempotent administrator bootstrap
        run: |
          set -Eeuo pipefail
          unset ConnectionStrings__DefaultConnection
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml --profile bootstrap run --rm bootstrap-admin
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml --profile bootstrap run --rm bootstrap-admin
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml exec -T postgres \
            sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM \"AspNetUsers\" WHERE \"Email\" = '\''ciadmin@example.test'\'';"' \
            | tr -d '[:space:]' | grep -Fx '1'

      - name: Start API, Web and Caddy
        run: |
          set -Eeuo pipefail
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml up -d api web caddy

      - name: Validate container health
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml)
          wait_for_health() {
            local service="$1"
            local container status
            for _ in {1..45}; do
              container="$("${compose[@]}" ps -q "$service")"
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing-healthcheck{{end}}' "$container")"
              if [[ "$status" == "healthy" ]]; then
                printf '%s: healthy\n' "$service"
                return 0
              fi
              printf '%s: %s\n' "$service" "$status"
              sleep 2
            done
            echo "O contêiner $service não se tornou saudável." >&2
            exit 1
          }
          wait_for_health api
          wait_for_health web
          "${compose[@]}" ps

      - name: Validate Web directly
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml)
          "${compose[@]}" exec -T web curl --include --fail --silent --show-error \
            --header 'Host: ci.example.test' http://127.0.0.1:8080/health/live
          "${compose[@]}" exec -T web curl --include --fail --silent --show-error \
            --header 'Host: ci.example.test' http://127.0.0.1:8080/health/ready

      - name: Validate Web to API communication
        run: |
          set -Eeuo pipefail
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml exec -T web \
            curl --include --fail --silent --show-error http://api:8080/health/ready

      - name: Validate Caddy smoke test
        run: |
          set -Eeuo pipefail
          for _ in {1..30}; do
            if bash deploy/scripts/smoke-local.sh; then
              exit 0
            fi
            sleep 2
          done
          bash deploy/scripts/smoke-local.sh

      - name: Validate PDF runtime internally
        run: |
          set -Eeuo pipefail
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml exec -T web \
            curl --include --fail --silent --show-error --header 'Host: ci.example.test' \
            http://127.0.0.1:8080/health/pdf

      - name: Validate public PDF endpoint is blocked
        run: |
          set -Eeuo pipefail
          status="$(curl --resolve 'ci.example.test:8088:127.0.0.1' --silent --show-error \
            --output /tmp/axiom-public-pdf-health.txt --write-out '%{http_code}' \
            http://ci.example.test:8088/health/pdf)"
          test "$status" = '404'

      - name: Validate Data Protection key persistence
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml)
          key_fingerprint() {
            local service="$1"
            "${compose[@]}" exec -T "$service" sh -c \
              'set -eu; find /var/lib/axiom-atlas/keys -type f -name "key-*.xml" -print -exec sha256sum {} \; | sort'
          }
          wait_for_health() {
            local service="$1" container status
            for _ in {1..30}; do
              container="$("${compose[@]}" ps -q "$service")"
              status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              [[ "$status" == 'healthy' ]] && return 0
              sleep 2
            done
            echo "$service não ficou saudável após reinício." >&2
            exit 1
          }
          for service in web api; do
            before="$(key_fingerprint "$service")"
            test -n "$before"
            "${compose[@]}" restart "$service"
            wait_for_health "$service"
            after="$(key_fingerprint "$service")"
            test "$before" = "$after"
          done

      - name: Validate PostgreSQL backup and restoration
        run: |
          set -Eeuo pipefail
          compose=(docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml)
          "${compose[@]}" exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > /tmp/axiom-atlas-ci-backup.sql
          "${compose[@]}" exec -T postgres sh -c \
            'createdb -U "$POSTGRES_USER" axiom_atlas_restore_ci && psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d axiom_atlas_restore_ci' \
            < /tmp/axiom-atlas-ci-backup.sql
          "${compose[@]}" exec -T postgres sh -c \
            'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d axiom_atlas_restore_ci -c "SELECT count(*) FROM \"__EFMigrationsHistory\";"'

      - name: Collect stack diagnostics on failure
        if: failure()
        run: |
          compose=(docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml)
          "${compose[@]}" ps || true
          for service in caddy web api; do
            "${compose[@]}" logs --no-color "$service" || true
          done
          web_id="$("${compose[@]}" ps -q web || true)"
          [[ -z "$web_id" ]] || docker inspect "$web_id" || true
          "${compose[@]}" exec -T web curl --include --header 'Host: ci.example.test' http://127.0.0.1:8080/health/ready || true
          "${compose[@]}" exec -T web curl --include http://api:8080/health/ready || true
          curl --resolve 'ci.example.test:8088:127.0.0.1' --include http://ci.example.test:8088/health/ready || true

      - name: Dependency vulnerability report
        run: dotnet list Axiom.Atlas.slnx package --vulnerable --include-transitive

      - name: Cleanup
        if: always()
        run: |
          test -f /tmp/axiom-api.pid && kill "$(cat /tmp/axiom-api.pid)" || true
          docker compose --env-file .env -f deploy/compose.prod.yml -f deploy/compose.local.yml down --remove-orphans || true
